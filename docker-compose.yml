services:

  consumer:
    build:
      dockerfile: apps/consumer/Dockerfile
      target: dev
      context: .
    volumes:
      - ./apps/consumer:/app/apps/consumer
      - ./packages:/app/packages
      - /app/packages/node-lib/node_modules
      - /app/apps/consumer/node_modules
    ports:
      - 3000:3000
    environment:
      RABBIT_MQ_URL: amqp://admin:admin@rabbitmq:5672
      TELEMETRY_QUEUE: telemetry_data_emitted_queue
    depends_on:
      - rabbitmq

  producer:
    build:
      dockerfile: apps/producer/Dockerfile
      target: dev
      context: .
    volumes:
      - ./apps/producer:/app/apps/producer
      - ./packages:/app/packages
      - /app/packages/node-lib/node_modules
      - /app/apps/producer/node_modules
    ports:
      - 3001:3000
    environment:
      RABBIT_MQ_URL: amqp://admin:admin@rabbitmq:5672
      TELEMETRY_QUEUE: telemetry_data_emitted_queue
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:4.1.4-management
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    hostname: "rabbitmq"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
